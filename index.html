<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login-Page</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      body {
        background-color: rgb(51, 50, 50);
      }
      .logindiv {
        width: 300px;
        height: 270px;
        background-image: linear-gradient(to right, brown, black);
        border-radius: 5px;
        position: absolute;
        top: 25%;
        left: 44%;
        box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
      }
      .registerdiv {
        width: 300px;
        height: 350px;
        background-image: linear-gradient(to right, brown, black);
        border-radius: 5px;
        position: absolute;
        top: 22%;
        left: 44%;
        box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        display: none;
      }
      .logintag,
      .registertag {
        padding-top: 15px;
        margin-left: 36%;
        color: white;
      }
      .inputs,
      .registerinputs {
        width: 250px;
        height: 40px;
        border-radius: 4px;
        border: none;
        background-color: transparent;
        border: 1px solid white;
        color: wheat;
        font-weight: 600;
        margin-top: 10px;
        margin-left: 15px;
        font-size: 17px;
        padding-left: 8px;
      }
      .inputs:focus {
        outline: none;
      }
      #loginaccount,
      .registerbtn {
        width: 250px;
        height: 30px;
        border-radius: 3px;
        border: none;
        margin-left: 20px;
        margin-top: 10px;
        color: white;
        font-size: 17px;
        font-weight: 550;
        background-color: rgb(91, 91, 221);
      }
      .para-section,
      .register-para-section {
        color: white;
        display: flex;
        font-size: 17px;
        margin-top: 15px;
        margin-left: 20px;
      }
      .regbtn,
      .logbtn {
        border: none;
        color: rgb(110, 110, 243);
        background-color: transparent;
        font-size: 15px;
        margin-left: 5px;
      }
      .fullimgs {
        width: 100%;
        height: 100vh;
      }
      @media (max-width: 600px) {
        body {
          background-color: rgb(51, 50, 50);
        }
        .fullimgs {
          display: none;
        }
        .logindiv {
          position: absolute;
          left: 20%;
        }
        .registerdiv {
          position: absolute;
          left: 20%;
        }
      }
       @media (max-width: 400px) {
        .logindiv {
          position: absolute;
          left: 12%;
        }
        .registerdiv {
          position: absolute;
          left: 12%;
        }
      }
    </style>
  </head>
  <body>
    <div class="logindiv">
      <div>
        <div>
          <h2 class="logintag">Login</h2>
        </div>
        <div>
          <input
            id="input1"
            class="inputs"
            type="email"
            placeholder="Enter your email"
          />
          <input
            id="input2"
            class="inputs"
            type="password"
            placeholder="Enter your password"
          />
          <a href="index2.html"
            ><button id="loginaccount" class="loginbtn">Login</button></a
          >
        </div>
        <div class="para-section">
          <p>Don't have an account?</p>
          <p>
            <button id="regbutton" class="regbtn">Create acount</button>
          </p>
        </div>
      </div>
    </div>

    <!---->
    <div class="registerdiv">
      <div>
        <div>
          <h2 class="registertag">Register</h2>
        </div>
        <div>
          <input
            id="input3"
            class="registerinputs"
            type="text"
            placeholder="Enter your name"
          />
          <input
            id="input4"
            class="registerinputs"
            type="number"
            placeholder="Enter your number"
          />
          <input
            id="input5"
            class="registerinputs"
            type="email"
            placeholder="Enter your email"
          />
          <input
            id="input6"
            class="registerinputs"
            type="password"
            placeholder="Enter your password"
          />
          <button id="regbtnnn" class="registerbtn">Register</button>
        </div>
        <div class="register-para-section">
          <p>Already have an account?</p>
          <p class="login2">
            <button id="registerdiv-login" class="logbtn">Login</button>
          </p>
        </div>
      </div>
    </div>
  </body>
  <script>
    var registerbtn = document.querySelector(".registerbtn");
    var loginpageregister = document.querySelector(".registerdiv");
    var createaccount = document.getElementById("regbutton");
    var loginaccount = document.getElementById("registerdiv-login");
    var loginpagelogin = document.querySelector(".logindiv");
    createaccount.addEventListener("click", function () {
      loginpagelogin.style.display = "none";
      loginpageregister.style.display = "block";
    });
    loginaccount.addEventListener("click", function () {
      loginpagelogin.style.display = "block";
      loginpageregister.style.display = "none";
    });
    registerbtn.addEventListener("click", function () {
      loginpagelogin.style.display = "block";
      loginpageregister.style.display = "none";
    });

    var loginaccount11 = document.getElementById("loginaccount");
    loginaccount11.addEventListener("click", function (event) {
      var input1 = document.getElementById("input1").value;
      var input2 = document.getElementById("input2").value;
      if (input1 === "" || input2 === "") {
        alert("Invalid email or password");
        event.preventDefault();
      } else {
        alert("Login successful..");
      }
    });
  </script>
</html>
